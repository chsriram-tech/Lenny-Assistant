version: '3.8'

services:
  # PostgreSQL Database with Vector capability
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny_db
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny_password
      POSTGRES_DB: lenny_growth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny_growth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lenny_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://lenny:lenny_password@db:5432/lenny_growth_db
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_PROVIDER=ollama
      - OLLAMA_MODEL=llama3
    depends_on:
      db:
        condition: service_healthy

  # React + Vite Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lenny_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional Ollama Local LLM Container
  ollama:
    image: ollama/ollama:latest
    container_name: lenny_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

volumes:
  postgres_data:
  ollama_storage:
